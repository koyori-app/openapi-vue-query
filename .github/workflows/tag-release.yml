name: Tag Release

# tag push → git-cliff changelog → GitHub Release draft 作成まで。
# npm publish は release.yml（Release published 時）のみ。二重発火防止のため --draft 必須。
# workflow_dispatch: 既存 tag の draft 未作成・untagged 化の手動復旧用（tag 移動禁止）。
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to create draft release for (e.g. v0.1.4)'
        required: true
        type: string

permissions:
  contents: write # gh release create

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # git-cliff needs full history for changelog
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag on remote
        run: |
          git fetch --tags origin
          git rev-parse "refs/tags/${{ steps.release_tag.outputs.name }}"

      - name: Install git-cliff
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: git-cliff

      - name: Generate changelog
        run: git-cliff --latest --strip header -o CHANGELOG_RELEASE.md

      - name: Create GitHub Release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release_tag.outputs.name }}"
          TARGET="$(git rev-list -n 1 "$TAG")"
          gh release create "$TAG" \
            --verify-tag \
            --target "$TARGET" \
            --draft \
            --title "$TAG" \
            --notes-file CHANGELOG_RELEASE.md
