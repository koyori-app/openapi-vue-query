name: Release

# 初版は手動 publish 後、npmjs.com でこのリポジトリ + workflow を
# Trusted Publisher として登録すること。以降は GitHub Release 公開で自動 publish。
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

      # pnpm 9 delegates publish to the system npm, and trusted publishing (OIDC)
      # requires npm >= 11.5.1 (the npm bundled with Actions' Node is 10.x and
      # fails with a misleading E404). Upgrade npm before publishing.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # No NODE_AUTH_TOKEN needed — OIDC id-token is exchanged automatically.
      - name: Publish to npm
        run: pnpm publish --provenance --access public --no-git-checks
